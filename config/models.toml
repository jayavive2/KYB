# Models for the CLI and the Streamlit app, and their prices.
#
# Every model is a LiteLLM model string, so any provider LiteLLM supports works:
#   nebius/<Token Factory ID>   NEBIUS_API_KEY      (`uv run kyb models` lists them)
#   openai/gpt-4.1-mini         OPENAI_API_KEY
#   anthropic/claude-haiku-4-5  ANTHROPIC_API_KEY
#   gemini/gemini-2.5-flash     GEMINI_API_KEY
# See https://docs.litellm.ai/docs/providers for the rest.
#
# Prices are USD per 1M tokens for the base flavor on Nebius Token Factory, copied from
# https://tokenfactory.nebius.com/api/public/models_info (checked 2026-11-27).
# The catalog changes: run `uv run kyb models` and check it before publishing results.
# A model with no price here falls back to LiteLLM's price list; if that has none either,
# its cost shows as "n/a".

[defaults]
# Every screen uses this planner and the champion reader; neither is picked per screen.
# The planner: a reasoning model ("fixed" = the hand-written plan in src/kyb/plan.py).
planner = "nebius/moonshotai/Kimi-K3.1-Pro"
# The first champion reader. After that, only a promotion from a reader eval changes the
# champion, and config/champion.json records it.
reader = "nebius/openai/gpt-oss-120b"

[eval]
# Checks every finding on each screen, and judges the reader eval. Kept out of the reader list so
# it never grades its own output.
judge = "nebius/deepseek-ai/DeepSeek-V4-Pro-0813"
# The heavy hitters: the largest text models on Token Factory, from five labs (catalog checked
# 2026-11-27). The app adds the champion to every comparison, so a challenger has to beat it.
# The judge is kept out of this list so it never grades its own output.
readers = [
  "nebius/moonshotai/Kimi-K3.1-Pro",            # 2.8T MoE, 104B active
  "nebius/meta-models/muse-spark-open",         # 816B, about 42B active
  "nebius/zai-org/GLM-5.3",                     # 750B MoE
  "nebius/nvidia/Nemotron-3-Ultra-550b-a55b",   # 550B, 55B active
  "nebius/MiniMaxAI/MiniMax-M3",                # 428B MoE
]

[prices."nebius/moonshotai/Kimi-K3.1-Pro"]
input = 2.00
output = 10.00

[prices."nebius/zai-org/GLM-5.3"]
input = 1.40
output = 4.40

[prices."nebius/MiniMaxAI/MiniMax-M3"]
input = 0.30
output = 1.20

[prices."nebius/zai-org/GLM-5.3-Flash"]
input = 0.15
output = 0.50

[prices."nebius/openai/gpt-oss-120b"]
input = 0.15
output = 0.60

[prices."nebius/nvidia/nemotron-3-super-120b-a12b"]
input = 0.30

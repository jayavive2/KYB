[project]
name = "kyb-screen"
version = "0.1.0"
description = "KYB adverse-media screening on Tavily + Nebius Token Factory, with trace-based replay for comparing models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tavily-python>=0.7.0",
    "openai>=1.40.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "openinference-semantic-conventions>=0.1.20",
    "streamlit>=1.50",
    "plotly>=5.24",
    "litellm>=1.111.0",
    "openinference-instrumentation-litellm>=0.1.61",
]

[project.scripts]
kyb = "kyb.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kyb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["ignore:.*ReadOnly.*:UserWarning"]  # from LiteLLM's pydantic types

[tool.ruff]
line-length = 120
